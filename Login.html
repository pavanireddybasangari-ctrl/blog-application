<!DOCTYPE html>
<html>
<head>
    <title>Login - MyBlog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .login-box {
            background: white;
            width: 85%;
            max-width: 400px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
        }

        a {
            color: #2563eb;
        }
    </style>
</head>

<body>

<header>
    <h2>MyBlog</h2>
</header>

<div class="login-box">

    <h1>Login</h1>

    <form>
        <input type="email" placeholder="Email" required>

        <input type="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p>
        Don't have an account?
        <a href="register.html">Register</a>
    </p>

    <p>
        <a href="index.html">← Back to Home</a>
    </p>

</div>

</body>
</html>
